id = "ltx-video"
label = "LTX Video"
category = "VID"
platform = "fal"
endpoint = "fal-ai/ltx-video"
description = "LTX Video — real-time video generation. Ultra-fast, 2-4s videos in seconds. Good for rapid iteration and draft-quality motion previews."

[pricing]
base_cost = 0.05
currency = "USD"
note = "Fastest video model — real-time generation"

[params.seed]
label = "Random Seed"
type = "integer"
optional = true
hidden = true
description = "The seed to use for random number generation."

[params.num_inference_steps]
label = "Inference Steps"
type = "integer"
default = 30
optional = true
min = 1
max = 50
description = "The number of inference steps to take."

[params.enable_safety_checker]
label = "Safety Checker"
type = "boolean"
default = true
optional = true
description = "Authorized callers may set false to request relaxed screening."

[params.guidance_scale]
label = "Guidance Scale"
type = "number"
default = 3
optional = true
max = 10
description = "The guidance scale to use."

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
default = "low quality, worst quality, deformed, distorted, disfigured, motion smear, motion artifacts, fused fingers, bad anatomy, weird hand, ugly"
optional = true
description = "The negative prompt to generate the video from."

id = "h3-img"
label = "MiniMax H3 · Image to Video"
category = "VID"
platform = "fal"
endpoint = "minimax/h3/image-to-video"
description = "MiniMax H3 image-to-video. Animates a first-frame image; a second picture becomes the end frame. 5-15s clips from 480P up to 4K."

[general]
image_url_param = "image_url"
end_image_param = "end_image_url"
slots = ["end_image_url", "target_audio_url"]
duration_type = "seconds"
duration_param_name = "duration"

[params.duration]
label = "Duration"
type = "integer"
default = 5
optional = true
min = 5
max = 15

[params.resolution]
label = "Resolution"
type = "select"
default = "2K"
optional = true
options = [
  { value = "480P", label = "480P · Fastest" },
  { value = "768P", label = "768P · Standard" },
  { value = "2K",   label = "2K · High" },
  { value = "4K",   label = "4K · Highest" },
]

[params.prompt_expansion_mode]
label = "Prompt Expansion"
type = "text"
default = "balanced"
note = "Documented values: disabled, fast, balanced, quality."

[params.enable_safety_checker]
label = "Safety Checker"
type = "boolean"
default = true
optional = true

[params.seed]
label = "Random Seed"
type = "integer"
optional = true
hidden = true

[params.sync_mode]
label = "Sync Mode"
type = "boolean"
default = false
optional = true
hidden = true
description = "Return the generated video as base64 instead of a CDN URL."

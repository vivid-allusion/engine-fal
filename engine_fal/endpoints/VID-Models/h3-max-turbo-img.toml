id = "h3-max-turbo-img"
label = "H3 Max Turbo · Image to Video"
category = "VID"
platform = "fal"
endpoint = "minimax/h3-max-turbo/image-to-video"
description = "MiniMax H3 Max Turbo image-to-video — animates a first-frame image (or end-only keyframe) with the same post-trained H3 quality. Output canvas follows the supplied image; 5-15s clips up to 1080P."

[pricing]
cost_per_second = 0.04
currency = "USD"
note = "$0.025/s at 480P, $0.04/s at 768P, $0.08/s at 1080P. Promotional 75%-off launch rates ($0.00625/$0.01/$0.02 per second) ran through 2026-09-14."

[general]
image_url_param = "image_url"
duration_type = "seconds"
duration_param_name = "duration"
slots = ["end_image_url", "target_audio_url"]

[params.duration]
label = "Duration"
type = "number"
default = 5
optional = true
min = 0.92
max = 15

[params.resolution]
label = "Resolution"
type = "select"
default = "768P"
optional = true
options = [
  { value = "480P",  label = "480P · Fastest" },
  { value = "768P",  label = "768P · Standard" },
  { value = "1080P", label = "1080P · Native refinement" },
]

[params.prompt_expansion_mode]
label = "Prompt Expansion"
type = "text"
default = "balanced"
note = "Documented values: disabled, balanced, quality."

[params.enable_safety_checker]
label = "Safety Checker"
type = "boolean"
default = true
optional = true

[params.seed]
label = "Random Seed"
type = "integer"
optional = true
hidden = true

[params.sync_mode]
label = "Sync Mode"
type = "boolean"
default = false
optional = true
hidden = true
description = "Return the generated video as base64 instead of a CDN URL."

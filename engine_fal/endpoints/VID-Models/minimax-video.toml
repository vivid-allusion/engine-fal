id = "minimax-video"
label = "Minimax Video"
category = "VID"
platform = "fal"
endpoint = "fal-ai/minimax-video"
description = "Minimax Video — high-quality video generation with strong motion coherence. Supports 5-10s videos. Good for cinematic motion with subject consistency."

[pricing]
base_cost = 0.15
currency = "USD"
note = "High quality — cinematic motion"

[general]
image_url_param = "image_url"
duration_type = "seconds"
duration_param_name = "duration"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "9:16", label = "9:16 · Portrait" },
  { value = "1:1",  label = "1:1 · Square" },
]

[params.duration]
label = "Duration"
type = "select"
default = "5"
options = [
  { value = "5",  label = "5s · Short" },
  { value = "10", label = "10s · Long" },
]

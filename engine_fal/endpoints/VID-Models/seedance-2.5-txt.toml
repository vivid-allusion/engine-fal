id = "seedance-2.5-txt"
label = "Seedance 2.5 · Text to Video"
category = "VID"
platform = "fal"
endpoint = "bytedance/seedance-2.5/text-to-video"
description = "Dreamina Seedance 2.5 text-to-video — native 30-second single-shot generation at up to 720p from one prompt, with synchronized audio and model-chosen duration and aspect ratio for prompt-driven framing."

[pricing]
cost_per_second = 0.4730
currency = "USD"
note = "Token-based billing: tokens = (height * width * duration * 24) / 1024, charged at $0.0214 per 1000 tokens for 480p and 720p ($0.0234 for 1080p). Approximate 16:9 rates: $0.2205/s (480p), $0.4730/s (720p), $1.164/s (1080p)."

[general]
duration_type = "seconds"
duration_param_name = "duration"

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
optional = true
options = [
  { value = "480p",  label = "480p · Fastest" },
  { value = "720p",  label = "720p · Standard" },
  { value = "1080p", label = "1080p · High quality" },
]

[params.duration]
label = "Duration"
type = "select"
default = "auto"
optional = true
options = [
  { value = "auto", label = "auto · Model decides" },
  { value = "4", label = "4s" },
  { value = "5", label = "5s" },
  { value = "6", label = "6s" },
  { value = "7", label = "7s" },
  { value = "8", label = "8s" },
  { value = "9", label = "9s" },
  { value = "10", label = "10s" },
  { value = "11", label = "11s" },
  { value = "12", label = "12s" },
  { value = "13", label = "13s" },
  { value = "14", label = "14s" },
  { value = "15", label = "15s" },
  { value = "16", label = "16s" },
  { value = "17", label = "17s" },
  { value = "18", label = "18s" },
  { value = "19", label = "19s" },
  { value = "20", label = "20s" },
  { value = "21", label = "21s" },
  { value = "22", label = "22s" },
  { value = "23", label = "23s" },
  { value = "24", label = "24s" },
  { value = "25", label = "25s" },
  { value = "26", label = "26s" },
  { value = "27", label = "27s" },
  { value = "28", label = "28s" },
  { value = "29", label = "29s" },
  { value = "30", label = "30s · Max" },
]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "auto"
optional = true
options = [
  { value = "auto", label = "auto · Model decides" },
  { value = "21:9", label = "21:9 · Ultrawide" },
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "4:3",  label = "4:3 · Classic" },
  { value = "1:1",  label = "1:1 · Square" },
  { value = "3:4",  label = "3:4 · Portrait" },
  { value = "9:16", label = "9:16 · Vertical" },
]

[params.generate_audio]
label = "Generate Audio"
type = "boolean"
default = true
optional = true

[params.bitrate_mode]
label = "Bitrate Mode"
type = "select"
default = "standard"
optional = true
options = [
  { value = "standard", label = "Standard · Default bitrate" },
  { value = "high",     label = "High · Larger file, higher quality" },
]

[params.end_user_id]
label = "End User ID"
type = "text"
default = ""
optional = true
hidden = true

[params.codec]
label = "Codec"
type = "select"
default = "auto"
optional = true
options = [
  { value = "auto", label = "auto · Default" },
  { value = "H264", label = "H264" },
  { value = "H265", label = "H265" },
]
description = "'auto' retains default video codec behaviour; 'H264' uses H.264; 'H265' uses H.265."

[params.draft]
label = "Draft"
type = "boolean"
default = false
optional = true
hidden = true
description = "Generate a draft preview at 480p, overriding resolution."

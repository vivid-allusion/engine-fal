id = "midas-depth"
label = "MiDaS · Depth Map"
category = "DEPTH"
platform = "fal"
endpoint = "fal-ai/imageutils/depth"
description = "MiDaS depth estimation on fal — turns one picture into a depth map. The model takes no prompt; line 1 of the Markdown file is only a note."

[pricing]
base_cost = 0.0
currency = "USD"
note = "fal list price: $0 per compute second."

[general]
image_url_param = "image_url"
send_prompt = false

[params.a]
label = "A"
type = "number"
default = 6.283185307179586
optional = true
hidden = true

[params.bg_th]
label = "Background Threshold"
type = "number"
default = 0.1
optional = true

# Off: with it on, fal adds a normal map, and this is a depth-map model.
[params.depth_and_normal]
label = "Depth and Normal"
type = "boolean"
default = false
optional = true
hidden = true

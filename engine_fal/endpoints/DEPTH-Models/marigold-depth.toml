id = "marigold-depth"
label = "Marigold · Depth Map"
category = "DEPTH"
platform = "fal"
endpoint = "fal-ai/imageutils/marigold-depth"
description = "Marigold depth estimation on fal — turns one picture into a depth map. The model takes no prompt; line 1 of the Markdown file is only a note."

[pricing]
base_cost = 0.0
currency = "USD"
note = "fal list price: $0 per compute second."

[general]
image_url_param = "image_url"
send_prompt = false

[params.ensemble_size]
label = "Ensemble Size"
type = "integer"
default = 10
optional = true
min = 2
max = 50
description = "Number of predictions to average over. Higher is more accurate but slower."

[params.num_inference_steps]
label = "Inference Steps"
type = "integer"
default = 10
optional = true
min = 2
max = 50
description = "Number of denoising steps. Higher is more accurate but slower."

[params.processing_res]
label = "Processing Resolution"
type = "integer"
default = 0
optional = true
min = 0
max = 2048
description = "Maximum processing resolution; 0 uses the size of the input picture."

id = "nano-banana-2.1-edit"
label = "Nano Banana 2.1 · Edit"
category = "IMG"
platform = "fal"
endpoint = "fal-ai/nano-banana-2.1/edit"
description = "Nano Banana 2.1 image editing on fal — transform one or more reference images from a prompt, with optional video/PDF context. Accepts multiple image URLs; requires at least the prompt."

[pricing]
base_cost = 0.04
currency = "USD"
note = "Token-billed (per 1M): text/thinking $1.764 in, $8.823 out; image $1.764 in, $35.294 out. fal's tests: ≈$0.0396 per 1K 16:9 image, $0.0593 at 2K, $0.1335 at 4K; edits add ≈$0.002 per reference, high thinking ≈+$0.01. Typical 1K image ≈$0.04."

[general]
image_url_param = "image_urls"
slots = ["video_url", "pdf_url"]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "auto"
optional = true
options = [
  { value = "auto", label = "auto · Model decides" },
  { value = "1:1",  label = "1:1 · Square" },
  { value = "3:2",  label = "3:2 · Landscape" },
  { value = "4:3",  label = "4:3 · Classic" },
  { value = "5:4",  label = "5:4 · Landscape" },
  { value = "16:9", label = "16:9 · Landscape · Standard" },
  { value = "21:9", label = "21:9 · Ultrawide · Cinematic" },
  { value = "2:3",  label = "2:3 · Portrait" },
  { value = "3:4",  label = "3:4 · Portrait" },
  { value = "4:5",  label = "4:5 · Portrait" },
  { value = "9:16", label = "9:16 · Vertical" },
  { value = "4:1",  label = "4:1 · Wide Panorama" },
  { value = "1:4",  label = "1:4 · Tall Vertical" },
  { value = "8:1",  label = "8:1 · Extreme Panorama" },
  { value = "1:8",  label = "1:8 · Extreme Vertical" },
]

[params.resolution]
label = "Resolution"
type = "select"
default = "1K"
optional = true
options = [
  { value = "1K",   label = "1K (1024px) · Standard" },
  { value = "2K",   label = "2K (2048px) · High Quality" },
  { value = "4K",   label = "4K (4096px) · Maximum" },
]
note = "Higher resolutions take longer and cost more"

[params.num_images]
label = "Number of Images"
type = "integer"
default = 1
min = 1
max = 4

[params.output_format]
label = "Output Format"
type = "select"
default = "png"
optional = true
options = [
  { value = "png",  label = "PNG · Lossless" },
  { value = "jpeg", label = "JPEG" },
  { value = "webp", label = "WebP" },
]

[params.safety_tolerance]
label = "Safety Tolerance"
type = "select"
default = "4"
optional = true
options = [
  { value = "1", label = "1 · Strictest" },
  { value = "2", label = "2" },
  { value = "3", label = "3" },
  { value = "4", label = "4 · Default" },
  { value = "5", label = "5" },
  { value = "6", label = "6 · Most permissive" },
]

[params.thinking_level]
label = "Thinking Level"
type = "select"
default = "medium"
optional = true
options = [
  { value = "minimal", label = "minimal · Fastest" },
  { value = "medium",  label = "medium · Default" },
  { value = "high",    label = "high · More reasoning" },
]

[params.enable_web_search]
label = "Enable Web Search"
type = "boolean"
default = false
optional = true
hidden = true

[params.system_prompt]
label = "System Prompt"
type = "text"
default = ""
optional = true
hidden = true

[params.seed]
label = "Random Seed"
type = "integer"
optional = true
hidden = true

[params.sync_mode]
label = "Sync Mode"
type = "boolean"
default = false
optional = true
hidden = true

[params.limit_generations]
label = "Limit Generations"
type = "boolean"
default = true
optional = true
hidden = true

id = "ideogram-v2"
label = "Ideogram v2"
category = "IMG"
platform = "fal"
endpoint = "fal-ai/ideogram/v2"
description = "Ideogram v2 — text-rendering specialist. Excellent at generating images with accurate text, logos, and typography."

[pricing]
base_cost = 0.04
currency = "USD"
note = "Text-rendering specialist"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "1:1"
optional = true
options = [
  { value = "10:16", label = "10:16 · Tall" },
  { value = "16:10", label = "16:10 · Wide" },
  { value = "9:16", label = "9:16 · Vertical" },
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "4:3", label = "4:3 · Classic" },
  { value = "3:4", label = "3:4 · Portrait" },
  { value = "1:1", label = "1:1 · Square" },
  { value = "1:3", label = "1:3 · Tall Banner" },
  { value = "3:1", label = "3:1 · Wide Banner" },
  { value = "3:2", label = "3:2 · Landscape" },
  { value = "2:3", label = "2:3 · Portrait" },
]

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
default = ""
optional = true
description = "A negative prompt to avoid in the generated image"

[params.seed]
label = "Random Seed"
type = "integer"
optional = true
hidden = true
description = "Seed for the random number generator"

[params.sync_mode]
label = "Sync Mode"
type = "boolean"
default = false
optional = true
hidden = true
description = "If `True`, the media will be returned as a data URI and the output data won't be available in the request history."

[params.expand_prompt]
label = "Expand Prompt"
type = "boolean"
default = true
optional = true
description = "Whether to expand the prompt with MagicPrompt functionality."

[params.style]
label = "Style"
type = "select"
default = "auto"
optional = true
options = [
  { value = "auto", label = "auto · Model decides" },
  { value = "general", label = "general · General" },
  { value = "realistic", label = "realistic · Realistic" },
  { value = "design", label = "design · Design" },
  { value = "render_3D", label = "render_3D · 3D render" },
  { value = "anime", label = "anime · Anime" },
]
description = "The style of the generated image"

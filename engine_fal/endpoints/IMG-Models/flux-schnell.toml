id = "flux-schnell"
label = "Flux Schnell"
category = "IMG"
platform = "fal"
endpoint = "fal-ai/flux/schnell"
description = "Flux Schnell — the fastest Flux image generation model. Optimized for speed, 1-4 steps. Ideal for rapid iteration and prototyping."

[pricing]
base_cost = 0.003
currency = "USD"
note = "Fastest Flux variant — lowest cost per image"

[params.num_images]
label = "Number of Images"
type = "integer"
default = 1
min = 1
max = 4

[params.image_size]
label = "Image Size"
type = "select"
default = "landscape_4_3"
optional = true
options = [
  { value = "square_hd", label = "square_hd · Square HD" },
  { value = "square", label = "square · Square" },
  { value = "portrait_4_3", label = "portrait_4_3 · 3:4 Portrait" },
  { value = "portrait_16_9", label = "portrait_16_9 · 9:16 Portrait" },
  { value = "landscape_4_3", label = "landscape_4_3 · 4:3 Landscape · Default" },
  { value = "landscape_16_9", label = "landscape_16_9 · 16:9 Landscape" },
]
description = "The size of the generated image."

[params.seed]
label = "Random Seed"
type = "integer"
optional = true
hidden = true
description = "The same seed and the same prompt given to the same version of the model will output the same image every time."

[params.output_format]
label = "Output Format"
type = "select"
default = "jpeg"
optional = true
options = [
  { value = "jpeg", label = "JPEG · Default" },
  { value = "png", label = "PNG · Lossless" },
]
description = "The format of the generated image."

[params.enable_safety_checker]
label = "Safety Checker"
type = "boolean"
default = true
optional = true
description = "If set to true, the safety checker will be enabled."

[params.num_inference_steps]
label = "Inference Steps"
type = "integer"
default = 4
optional = true
min = 1
max = 12
description = "The number of inference steps to perform."

[params.sync_mode]
label = "Sync Mode"
type = "boolean"
default = false
optional = true
hidden = true
description = "If `True`, the media will be returned as a data URI and the output data won't be available in the request history."

[params.acceleration]
label = "Acceleration"
type = "select"
default = "none"
optional = true
options = [
  { value = "none", label = "none · Default" },
  { value = "regular", label = "regular" },
  { value = "high", label = "high" },
]
description = "The speed of the generation."

[params.guidance_scale]
label = "Guidance Scale"
type = "number"
default = 3.5
optional = true
min = 1
max = 20
description = "The CFG (Classifier Free Guidance) scale is a measure of how close you want the model to stick to your prompt when looking for a related image to show you."

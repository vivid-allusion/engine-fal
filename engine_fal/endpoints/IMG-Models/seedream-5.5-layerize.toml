id = "seedream-5.5-layerize"
label = "Seedream 5.5 · Layerize"
category = "IMG"
platform = "fal"
endpoint = "bytedance/seedream/v5.5/layerize"
description = "ByteDance Seedream 5.5 Layerize on fal — splits one picture into a base picture plus separate layers; the prompt names what to separate."

[general]
image_url_param = "image_url"

[params.image_size]
label = "Image Size"
type = "select"
default = "auto"
optional = true
options = [
  { value = "auto", label = "Auto · Matches input" },
  { value = "auto_1K", label = "Auto 1K" },
  { value = "auto_1.5K", label = "Auto 1.5K" },
  { value = "auto_2K", label = "Auto 2K" },
]

[params.max_images]
label = "Max Images (including base)"
type = "integer"
default = 30
min = 2
max = 100

[params.output_format]
label = "Output Format"
type = "select"
default = "png"
optional = true
options = [
  { value = "png",  label = "PNG · Lossless" },
  { value = "jpeg", label = "JPEG" },
]

[params.enable_text_recognition]
label = "Enable Text Recognition"
type = "boolean"
default = false
optional = true

[params.watermark]
label = "Watermark"
type = "boolean"
default = false
optional = true

[params.enable_safety_checker]
label = "Enable Safety Checker"
type = "boolean"
default = true
optional = true
hidden = true

[params.sync_mode]
label = "Sync Mode"
type = "boolean"
default = false
optional = true
hidden = true

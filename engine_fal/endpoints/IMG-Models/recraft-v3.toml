id = "recraft-v3"
label = "Recraft v3"
category = "IMG"
platform = "fal"
endpoint = "fal-ai/recraft-v3"
description = "Recraft v3 — vector-style and design-focused image generation. Strong for branding, logos, illustrations, and design mockups."

[pricing]
base_cost = 0.04
currency = "USD"
note = "Design and branding specialist"

# Server inputs with no wizard widget. Checked against the live schema.
# UNRENDERABLE: colors

[params.enable_safety_checker]
label = "Safety Checker"
type = "boolean"
default = false
optional = true
description = "If set to true, the safety checker will be enabled."

[params.image_size]
label = "Image Size"
type = "select"
default = "square_hd"
optional = true
options = [
  { value = "square_hd", label = "square_hd · Square HD · Default" },
  { value = "square", label = "square · Square" },
  { value = "portrait_4_3", label = "portrait_4_3 · 3:4 Portrait" },
  { value = "portrait_16_9", label = "portrait_16_9 · 9:16 Portrait" },
  { value = "landscape_4_3", label = "landscape_4_3 · 4:3 Landscape" },
  { value = "landscape_16_9", label = "landscape_16_9 · 16:9 Landscape" },
]


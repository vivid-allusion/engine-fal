id = "recraft-v3"
label = "Recraft v3"
category = "IMG"
platform = "fal"
endpoint = "fal-ai/recraft-v3"
description = "Recraft v3 — vector-style and design-focused image generation. Strong for branding, logos, illustrations, and design mockups."

[pricing]
base_cost = 0.04
currency = "USD"
note = "Design and branding specialist"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "1:1"
optional = true
options = [
  { value = "1:1",   label = "1:1 · Square" },
  { value = "2:3",   label = "2:3 · Portrait" },
  { value = "3:2",   label = "3:2 · Landscape" },
  { value = "9:16",  label = "9:16 · Vertical" },
  { value = "16:9",  label = "16:9 · Landscape" },
]

[params.resolution]
label = "Resolution"
type = "select"
default = "1K"
optional = true
options = [
  { value = "1K", label = "1K · Standard" },
  { value = "2K", label = "2K · High Quality" },
]
